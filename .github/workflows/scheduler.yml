---
name: Scheduler
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout dist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dist
          path: dist
          persist-credentials: false  # prevent using GITHUB_TOKEN to commit
          fetch-depth: 0
          filter: blob:none

      - name: Prepare dist history
        id: dist-history
        working-directory: dist
        run: |
          amend=true
          commit_count="$(git rev-list --count HEAD)"
          if ((commit_count > 1)); then
            git checkout --orphan deployment
            amend=false
          fi

          echo "amend=${amend}" >> "${GITHUB_OUTPUT}"

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup env
        env:
          SECRET_GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          SECRET_PATREON_CREATOR_TOKEN: ${{ secrets.PATREON_CREATOR_TOKEN }}
          SECRET_CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        run: |
          # sponsors
          {
            echo "CONTRIBKIT_GITHUB_TOKEN=${SECRET_GH_BOT_TOKEN}"
            echo "CONTRIBKIT_GITHUB_LOGIN=${GITHUB_REPOSITORY_OWNER}"
            echo "CONTRIBKIT_PATREON_TOKEN=${SECRET_PATREON_CREATOR_TOKEN}"
          } >> ./configs/sponsors/.env

          # crowdin contributors
          {
            echo "CONTRIBKIT_CROWDIN_TOKEN=${SECRET_CROWDIN_TOKEN}"
          } >> ./configs/crowdin/.env

          # github contributors
          {
            echo "CONTRIBKIT_GITHUB_CONTRIBUTORS_TOKEN=${SECRET_GH_BOT_TOKEN}"
            echo "CONTRIBKIT_GITHUB_CONTRIBUTORS_LOGIN=${GITHUB_REPOSITORY_OWNER}"
          } >> ./configs/github/.env

          # github contributions
          {
            echo "CONTRIBKIT_GITHUB_CONTRIBUTIONS_TOKEN=${SECRET_GH_BOT_TOKEN}"
          } >> ./configs/githubContributions/.env

      - name: Setup dist
        run: |
          # empty dist directory
          rm -rf dist/*

          # setup .gitignore
          printf '.cache.json\n' > dist/.gitignore

      - name: Update
        env:
          CONTRIBKIT_GITHUB_TYPE: organization
        run: npm run build

      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: 'error'

      - name: Commit and push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc  # v1.6
        with:
          github_token: ${{ secrets.GH_BOT_TOKEN }}
          author_email: ${{ secrets.GH_BOT_EMAIL }}
          author_name: ${{ vars.GH_BOT_NAME }}
          branch: dist
          directory: dist
          amend: ${{ steps.dist-history.outputs.amend }}
          force: true
          message: "chore: update contributors"
